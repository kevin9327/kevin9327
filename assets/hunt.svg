<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f85149" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f85149" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="bug">
      <line x1="-6" y1="-11" x2="-12" y2="-22" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <line x1="6"  y1="-11" x2="12"  y2="-22" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <line x1="-6" y1="11"  x2="-12" y2="22"  stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <line x1="6"  y1="11"  x2="12"  y2="22"  stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <line x1="-14" y1="-8" x2="-22" y2="-12" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <line x1="-14" y1="8"  x2="-22" y2="12"  stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="17" ry="13" fill="#f85149"/>
      <circle cx="-17" cy="0" r="8" fill="#da3633"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#0d1117" stroke-width="2"/>
      <circle cx="6" cy="-5" r="2.5" fill="#0d1117"/>
      <circle cx="6" cy="5" r="2.5" fill="#0d1117"/>
      <circle cx="-20" cy="-3" r="1.5" fill="#ffffff"/>
    </g>
    <g id="check">
      <circle r="22" fill="#3fb950"/>
      <path d="M-10 0 L-3 8 L11 -8" fill="none" stroke="#0d1117" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="150" fill="#0d1117"/>
  <rect x="0" y="72" width="1200" height="6" fill="url(#lane)"/>

  <text x="60" y="40" font-size="16" font-weight="700" fill="#f85149" letter-spacing="3">INCOMING BUGS</text>
  <text x="1140" y="40" font-size="16" font-weight="700" fill="#3fb950" letter-spacing="3" text-anchor="end">SHIPPED FIXES</text>

  <!-- bug 1 -->
  <g>
    <use href="#bug">
      <animateTransform attributeName="transform" type="translate" values="-60 75;600 75;600 75;600 75" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="0s" repeatCount="indefinite"/>
    </use>
    <use href="#check">
      <animateTransform attributeName="transform" type="translate" values="600 75;600 75;600 75;1260 75;1260 75" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="0s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- bug 2 -->
  <g>
    <use href="#bug">
      <animateTransform attributeName="transform" type="translate" values="-60 75;600 75;600 75;600 75" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
    </use>
    <use href="#check">
      <animateTransform attributeName="transform" type="translate" values="600 75;600 75;600 75;1260 75;1260 75" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="2.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- bug 3 -->
  <g>
    <use href="#bug">
      <animateTransform attributeName="transform" type="translate" values="-60 75;600 75;600 75;600 75" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.56;1" dur="7.5s" begin="5s" repeatCount="indefinite"/>
    </use>
    <use href="#check">
      <animateTransform attributeName="transform" type="translate" values="600 75;600 75;600 75;1260 75;1260 75" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.98;1" dur="7.5s" begin="5s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- impact flash at the crosshair, once per bug -->
  <circle cx="600" cy="75" r="20" fill="none" stroke="#facc15" stroke-width="4">
    <animate attributeName="r" values="20;70" dur="2.5s" begin="3.75s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.5s" begin="3.75s" repeatCount="indefinite"/>
  </circle>

  <!-- the crosshair -->
  <g transform="translate(600 75)" filter="url(#glow)">
    <circle r="34" fill="none" stroke="url(#hot)" stroke-width="10"/>
    <rect x="-5" y="-58" width="10" height="20" rx="2" fill="url(#hot)"/>
    <rect x="-5" y="38"  width="10" height="20" rx="2" fill="url(#hot)"/>
    <rect x="-58" y="-5" width="20" height="10" rx="2" fill="url(#hot)"/>
    <rect x="38"  y="-5" width="20" height="10" rx="2" fill="url(#hot)"/>
    <circle r="11" fill="url(#hot)"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.12;1" dur="1.25s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="138" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="2">EVERY FIX SHIPS WITH A TEST THAT FAILS BEFORE AND PASSES AFTER</text>
</svg>
