<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="comet">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="comet2">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#line)"/>
  <ellipse cx="0" cy="7" rx="70" ry="6" fill="url(#comet)">
    <animate attributeName="cx" values="-90;1290" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="0" cy="7" r="3.5" fill="#ffffff">
    <animate attributeName="cx" values="-90;1290" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="0" cy="7" rx="50" ry="5" fill="url(#comet2)">
    <animate attributeName="cx" values="1290;-90" dur="4.6s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="0" cy="7" r="3" fill="#ffffff">
    <animate attributeName="cx" values="1290;-90" dur="4.6s" repeatCount="indefinite"/>
  </circle>
</svg>
